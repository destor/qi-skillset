name: Package skills

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: ./scripts/build.sh

      - name: List skills
        id: list
        run: |
          set -euo pipefail
          names=()
          for zip in dist/*.zip; do
            names+=("$(basename "$zip" .zip)")
          done
          json="$(printf '"%s",' "${names[@]}")"
          echo "skills=[${json%,}]" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: prompts
          path: dist/prompts
          if-no-files-found: error

  package:
    name: Package ${{ matrix.skill }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.build.outputs.skills) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Stage skill folder
        run: |
          set -euo pipefail
          mkdir staging
          src="dist/${{ matrix.skill }}"
          [ -d "$src" ] || src="dist/harness/${{ matrix.skill }}"
          mv "$src" staging/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.skill }}
          path: staging
          if-no-files-found: error

  release:
    name: Attach zips to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Create release or update the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/prompts/*.md --clobber
            exit 0
          fi

          read -r type sha < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          notes=""
          if [ "$type" = tag ]; then
            notes="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message | sed '/^-----BEGIN /,$d')"
          fi

          if [ -n "${notes//[[:space:]]/}" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" dist/*.zip dist/prompts/*.md --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            gh release create "$TAG" dist/*.zip dist/prompts/*.md --title "$TAG" --generate-notes --verify-tag
          fi
