name: Package skills

# Runs scripts/build.sh, which builds one zip per folder in skills/ (portable
# skills) and in harness-skills/ (skills for an agent harness such as Claude
# Code), with the files in shared/ merged in. Each zip has the skill folder at
# its root (qi-tutor.zip contains qi-tutor/SKILL.md, qi-tutor/references/...),
# which is the layout Claude, ChatGPT and Gemini expect when a skill is
# uploaded.
#
# build.sh also runs scripts/build-prompts.sh, which writes copy-paste prompts
# to dist/prompts/ for chats that cannot import skills: for each portable
# skill a condensed one (<name>-prompt.md) and one with the reference files included
# (<name>-prompt-full.md).
#
# - Every push to main, every pull request and every manual run: the zips are
#   available as workflow artifacts on the run page, one per skill, and the
#   prompts as one artifact named "prompts".
# - Pushing a tag such as v1.0.0: the zips and the prompts are also attached
#   to a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build skills
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: ./scripts/build.sh

      - name: List skills
        id: list
        run: |
          set -euo pipefail
          names=()
          for zip in dist/*.zip; do
            names+=("$(basename "$zip" .zip)")
          done
          json="$(printf '"%s",' "${names[@]}")"
          echo "skills=[${json%,}]" >> "$GITHUB_OUTPUT"

      # Passed on to the jobs below, so the skills are built once.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v7
        with:
          name: prompts
          path: dist/prompts
          if-no-files-found: error

  package:
    name: Package ${{ matrix.skill }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.build.outputs.skills) }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # upload-artifact zips whatever it is given. Staging the skill folder
      # inside an otherwise empty folder makes the downloaded artifact itself
      # the importable zip, with no zip inside a zip.
      - name: Stage skill folder
        run: |
          set -euo pipefail
          mkdir staging
          # Portable skills are in dist/, agent-harness skills in dist/harness/.
          src="dist/${{ matrix.skill }}"
          [ -d "$src" ] || src="dist/harness/${{ matrix.skill }}"
          mv "$src" staging/

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.skill }}
          path: staging
          if-no-files-found: error

  release:
    name: Attach zips to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # A release drafted in the GitHub UI already exists when its tag triggers
      # this run, and so does one from an earlier run of the same tag. In both
      # cases the zips and prompts are added to it, replacing any of the same
      # name, and its notes are left as they are.
      #
      # A new release takes its notes from the tag's message when the tag is
      # annotated (git tag -a v1.0.0 -m "..."); otherwise GitHub generates
      # them from the commits since the previous release.
      - name: Create release or update the existing one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/prompts/*.md --clobber
            exit 0
          fi

          read -r type sha < <(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          notes=""
          if [ "$type" = tag ]; then
            # A signed tag carries its signature at the end of the message.
            notes="$(gh api "repos/$GH_REPO/git/tags/$sha" --jq .message | sed '/^-----BEGIN /,$d')"
          fi

          if [ -n "${notes//[[:space:]]/}" ]; then
            printf '%s\n' "$notes" > "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" dist/*.zip dist/prompts/*.md --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          else
            gh release create "$TAG" dist/*.zip dist/prompts/*.md --title "$TAG" --generate-notes --verify-tag
          fi
